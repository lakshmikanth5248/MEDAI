envVarGroups:
  - name: medai-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

services:
  - type: web
    name: medai-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    envVarGroups:
      - medai-shared
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://medai-chi-pearl.vercel.app,http://localhost:5173
