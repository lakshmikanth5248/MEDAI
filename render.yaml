envVarGroups:
  - name: medai-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

services:
  - type: web
    name: medai-gateway
    runtime: python
    region: singapore
    plan: free
    rootDir: backend/gateway
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    healthCheckPath: /health
    envVarGroups:
      - medai-shared
    envVars:
      - key: FRONTEND_ORIGIN
        value: http://localhost:5173
      - key: AUTH_SERVICE_URL
        value: https://medai-auth.onrender.com
      - key: CLINICAL_SERVICE_URL
        value: https://medai-clinical.onrender.com
      - key: PRESCRIPTION_SERVICE_URL
        value: https://medai-prescription.onrender.com
      - key: PHARMACY_SERVICE_URL
        value: https://medai-pharmacy.onrender.com
      - key: BILLING_SERVICE_URL
        value: https://medai-billing.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://medai-notification.onrender.com
      - key: CORE_SERVICE_URL
        value: https://medai-core.onrender.com

  - type: web
